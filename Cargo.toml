[workspace]
resolver = "2"
members = [
    "crates/ocpp-types",
    "crates/ocpp-messages",
    "crates/ocpp-transport",
    "crates/ocpp-cp",
    "crates/ocpp-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["ocpp-rs contributors"]
license = "MIT"
repository = "https://github.com/ocpp-rs/ocpp-rs"
homepage = "https://github.com/ocpp-rs/ocpp-rs"
description = "A modern, production-grade OCPP implementation in Rust"
keywords = ["ocpp", "ev", "charging", "websocket", "electric-vehicle"]
categories = ["network-programming", "simulation", "web-programming::websocket"]

# Workspace-wide lint configuration. Applied to each crate via `[lints]
# workspace = true`. See issue #591: clippy 1.99.0 tightened
# `clippy::double_must_use` so that it now fires on the `Pin<Box<dyn Future>>`
# that `#[async_trait]` desugars to (the attribute macro attaches a bare
# `#[must_use]`, and the boxed future is itself already `#[must_use]`). The
# warning is entirely macro-generated — the source never writes `#[must_use]` —
# and `-D warnings` in CI turns it into a hard error on every `#[async_trait]`
# trait in the workspace. Allowing it in one place keeps CI green on current
# and future stable clippy without scattering `#[allow]` on each trait.
[workspace.lints.clippy]
double_must_use = "allow"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# WebSocket and HTTP
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
tungstenite = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
futures = "0.3"
futures-util = "0.3"

# Testing
proptest = "1.4"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1
debug = true

[profile.bench]
opt-level = 3
debug = false
lto = "thin"
