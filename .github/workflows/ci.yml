name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast gate: fmt + clippy run once (stable only) before spinning up the
  # full 3-toolchain matrix, coverage, docs, msrv, and conformance jobs.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.rust }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: stable
            can-fail: false
          - rust: beta
            can-fail: false
          - rust: nightly
            can-fail: true
    continue-on-error: ${{ matrix.can-fail }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.rust }}

    - name: Run tests
      run: cargo test --workspace --all-features

    - name: Run doctests
      if: matrix.rust == 'stable'
      run: cargo test --workspace --doc --all-features

  coverage:
    name: Code Coverage
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin

    - name: Generate code coverage
      run: |
        cargo tarpaulin \
          --workspace \
          --all-features \
          --timeout 120 \
          --out xml \
          --output-dir coverage/ \
          --exclude-files "target/*" \
          --exclude-files "*/tests/*" \
          --exclude-files "*/benches/*"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        file: coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run cargo audit
      uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Documentation
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    # Build docs with -D warnings as a CI check. We intentionally do NOT
    # publish to GitHub Pages here: the peaceiris/actions-gh-pages deploy
    # required `contents: write` on GITHUB_TOKEN, which the repo does not
    # grant, so the step failed with a 403 on every push to main and was the
    # sole reason `main` CI was red (see #41). Building docs still validates
    # that rustdoc compiles cleanly; re-introduce publishing via the official
    # actions/deploy-pages pipeline if/when Pages hosting is wanted.
    - name: Build documentation
      run: |
        cargo doc --workspace --all-features --no-deps --document-private-items
      env:
        RUSTDOCFLAGS: "--deny warnings"

  msrv:
    name: Minimum Supported Rust Version
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Keep in sync with rust-version in Cargo.toml [workspace.package].
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.88.0

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check MSRV
      run: cargo check --workspace --all-targets --all-features

  conformance:
    name: OCPP Conformance Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run OCPP 1.6J conformance tests
      run: cargo test --package ocpp-conformance --all-features -- --nocapture
      env:
        OCPP_VERSION: "1.6J"
        RUST_LOG: info
