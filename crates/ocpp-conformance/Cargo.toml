[package]
name = "ocpp-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OCPP ocpp-conformance implementation"
keywords.workspace = true
categories.workspace = true

[dependencies]
ocpp-types = { path = "../ocpp-types" }
ocpp-messages = { path = "../ocpp-messages" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# End-to-end CP ↔ CSMS session test (Issue #29) drives both halves in-process.
ocpp-transport = { path = "../ocpp-transport" }
ocpp-cp = { path = "../ocpp-cp" }
tokio = { workspace = true, features = ["test-util", "macros"] }
chrono = { workspace = true }
# Test-only: implement a scripted `MessageHandler` that swallows one action to
# drive `ChargePoint::call()`'s timeout path end-to-end (charge_point_call_e2e).
async-trait = "0.1"
# Test-only: hand-craft a raw WebSocket peer that puts an out-of-spec CALLERROR
# `error_code` on the wire (the stock `OcppServer` can only emit the 12 spec
# codes), driving the real client.rs / server.rs recv loops end-to-end
# (wire_level_call_error, Issue #383).
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# Test-only: property-based fuzz sweeps over arbitrary wire input, asserting the
# decode paths never panic and only surface sanctioned protocol errors — the
# array-form decode boundary (decode_fuzz_robustness, Issue #406) and the
# object-form CALLERROR recovery boundary (recover_call_error_fuzz, Issue #409),
# both porting test_messages.py::test_unpack_and_pack / CallError.to_exception.
proptest = { workspace = true }

